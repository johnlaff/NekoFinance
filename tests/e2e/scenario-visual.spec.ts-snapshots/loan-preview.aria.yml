  - text: Data da 1ª parcela
  - textbox "Data da 1ª parcela": /\d+-\d+-\d+/
  - text: /Parcela R\$ \d+,\d+ Total pago R\$ \d+\.\d+,\d+ Custo do crédito R\$ \d+\.\d+,\d+/
  - button "Adicionar empréstimo ao cenário"