- banner:
  - text: /Hoje Quarta-feira, \d+ de junho/
  - button "Alternar para tema claro"
  - button "Mais telas"
- main:
  - region "Veredito de hoje":
    - heading "Boa tarde." [level=1]
    - paragraph: /Pode gastar hoje R\$ \d+,\d+ Sem deixar nenhum dia no vermelho\./
    - paragraph:
      - text: "/Este é o limite do caixa: o maior gasto que o saldo aguenta até 15 de junho sem nenhum dia no vermelho\\. Teto:/"
      - button /R\$ \d+,\d+ por dia/
      - text: .
      - button "Como funciona?"
  - paragraph: A Mia separou o que importa hoje — a ordem muda com o seu dia, os números nunca.
  - region "Gasto variável de hoje":
    - heading "Gasto variável de hoje" [level=2]
    - button "Ver tudo — gasto variável"
    - paragraph: /R\$ \d+,\d+ — lançado no Diário hoje/
    - button "Modo débito"
    - text: /Diário de hoje R\$ \d+,\d+ \/ R\$ \d+,\d+/
    - img /Diário de hoje em \d+% do teto/
    - paragraph: Lance o gasto de hoje para manter o saldo fiel — o registro vive no botão Registrar lançamento.
  - complementary "Leitura da Mia":
    - paragraph: "/Fechando o dia assim, junho termina em Folga — saldo previsto de R\\$ \\d+\\.\\d+,\\d+\\. O ponto mais apertado do mês é dia \\d+: R\\$ \\d+\\.\\d+,\\d+, e a próxima entrada chega dia \\d+\\. Nenhum dia no vermelho à vista — no método, isso é ficar sem \"buraco do futuro\"\\./"
  - region "Próximos movimentos":
    - heading "Próximos movimentos" [level=2]
    - button "Ver tudo — próximos movimentos"
    - list "Próximos movimentos":
      - listitem: /Entrada prevista R\$ \d+\.\d+,\d+ \d+ de junho/
      - listitem: /Compromisso fixo demo −R\$ \d+,\d+ \d+ de junho/
    - text: /R\$ \d+\.\d+,\d+ Custo de vida no mês \d+% Guardado no mês/
  - region "Saldo e reserva":
    - heading "Saldo e reserva" [level=2]
    - button "Ver o mês ›"
    - text: /R\$ \d+\.\d+,\d+ Saldo hoje Termômetro Folga — acima dos R\$ \d+\.\d+ da régua da planilha \d+,\d+ meses Reserva de emergência O método pede 6 meses de custo de vida/
- navigation "Navegação do app":
  - button "Hoje"
  - button "Lançamentos"
  - button "Este mês"
  - button "Calendário"
  - button "Mia"
  - button "Registrar lançamento"