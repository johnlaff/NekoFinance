- complementary:
  - text: Neko
  - button "Registrar lançamento (N)"
  - navigation "Navegação principal":
    - button "Hoje"
    - button "Lançamentos"
    - button "Este mês"
    - button "Cartões"
    - button "O ano"
    - button "Calendário"
    - button "Horizonte"
    - button "Tags"
    - button "Mia"
