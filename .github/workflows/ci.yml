name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore private privacy denylist
        # Só em push ou PR same-repo: forks não recebem secrets de todo modo, mas o guard torna
        # explícito que a denylist privada nunca é materializada num workspace que rode código
        # de terceiros.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          PRIVATE_FORBIDDEN_PATTERNS_B64: ${{ secrets.PRIVATE_FORBIDDEN_PATTERNS_B64 }}
        run: |
          if [ -n "$PRIVATE_FORBIDDEN_PATTERNS_B64" ]; then
            umask 077
            printf '%s' "$PRIVATE_FORBIDDEN_PATTERNS_B64" | base64 -d > .private-forbidden-patterns
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config patchelf

      - name: Install dependencies
        # --ignore-scripts: não roda lifecycle scripts de dependências no mesmo job que vê secrets
        # (fronteira secret↔build; o projeto não tem install scripts próprios).
        run: npm ci --ignore-scripts

      - name: Audit npm production dependencies
        # Falha só em vulnerabilidade ALTA+ de dependência de produção (devDeps ficam de fora — não
        # vão no bundle). 0 vulns hoje; trava regressões de supply-chain no JS.
        run: npm audit --omit=dev --audit-level=high

      - name: Run quality gates
        env:
          PRIVACY_SCAN_REQUIRE_DENYLIST: ${{ secrets.PRIVATE_FORBIDDEN_PATTERNS_B64 != '' && '1' || '0' }}
        run: npm run check

      - name: Audit Rust dependencies (RUSTSEC)
        # cargo-audit falha só em VULNERABILIDADE (avisos de unmaintained/unsound de deps transitivas
        # do stack GTK/Tauri não bloqueiam). O binário é cacheado pelo rust-cache (cache-bin).
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock
