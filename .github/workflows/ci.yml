name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Restore private privacy denylist
        env:
          PRIVATE_FORBIDDEN_PATTERNS_B64: ${{ secrets.PRIVATE_FORBIDDEN_PATTERNS_B64 }}
        run: |
          if [ -n "$PRIVATE_FORBIDDEN_PATTERNS_B64" ]; then
            umask 077
            printf '%s' "$PRIVATE_FORBIDDEN_PATTERNS_B64" | base64 -d > .private-forbidden-patterns
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config patchelf

      - name: Install dependencies
        # --ignore-scripts: não roda lifecycle scripts de dependências no mesmo job que vê secrets
        # (fronteira secret↔build; o projeto não tem install scripts próprios).
        run: npm ci --ignore-scripts

      - name: Run quality gates
        env:
          PRIVACY_SCAN_REQUIRE_DENYLIST: ${{ secrets.PRIVATE_FORBIDDEN_PATTERNS_B64 != '' && '1' || '0' }}
        run: npm run check
