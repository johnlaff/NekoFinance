name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.96.0

      - uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: src-tauri

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'neko-finance-v__VERSION__' }}
          releaseName: "Neko Finance v__VERSION__"
          releaseBody: "Desktop build generated by GitHub Actions. Updater artifacts are disabled until release signing keys are configured."
          releaseDraft: true
          prerelease: true
          generateReleaseNotes: true
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}

      # The bundles above are installers (NSIS/MSI). Also publish the portable
      # single-file exe: the WebView2 loader and the VC runtime are statically
      # linked on the msvc target (webview2-com-sys + tauri-build defaults),
      # so the binary runs standalone on Windows 10/11.
      - name: Upload portable single-file exe (workflow artifact)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: neko-finance-windows-x64-portable
          path: src-tauri/target/release/neko-finance.exe

      - name: Attach portable exe to the release
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Copy-Item "src-tauri/target/release/neko-finance.exe" "neko-finance-${{ github.ref_name }}-windows-x64-portable.exe"
          gh release upload "${{ github.ref_name }}" "neko-finance-${{ github.ref_name }}-windows-x64-portable.exe" --clobber
