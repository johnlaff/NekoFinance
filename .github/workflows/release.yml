name: Release

# Disparo só por workflow_dispatch: o Release Please despacha este workflow ao
# criar o draft (a tag ainda não existe nesse momento — ela nasce quando o
# mantenedor publica o draft). Um gatilho por push de tag reconstruiria a
# release já publicada logo após o publish, mutando artefatos públicos.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v0.3.0) — o draft com esse nome recebe os artefatos"
        required: true
        type: string
      sha:
        description: "Commit do bump de versão a ser buildado"
        required: true
        type: string

# Least privilege at the top level; the write scopes are granted per-job below
# so the elevated token is never the default for the whole workflow.
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-desktop:
    # contents: write — create/update the draft release and upload assets
    # id-token + attestations — SLSA build provenance for the released binaries
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O sha vem do output do Release Please (commit do bump), nunca de
          # input de terceiro — o dispatch é restrito a quem tem write no repo.
          ref: ${{ inputs.sha }}
          persist-credentials: false

      # No `cache:` input on purpose — caches are disabled in this publishing
      # workflow (cache-poisoning hardening); setup-node does not cache without it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version-file: .node-version

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.0

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config patchelf

      - name: Install dependencies
        # --ignore-scripts: não roda lifecycle scripts de dependências no mesmo job que vê o
        # GITHUB_TOKEN do release (fronteira secret↔build; o projeto não tem install scripts próprios).
        run: npm ci --ignore-scripts

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Bakes the Google OAuth client into the Vite bundle (see src/lib/env.ts,
          # src/lib/api.ts) the same way a local `.env` does for `npm run tauri build`.
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_DESKTOP_CLIENT_KEY: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_KEY }}
          # Same desktop client secret, embedded in the Rust binary via `option_env!`
          # (src-tauri/src/oauth/pkce.rs::resolve_client_secret). The frontend only forwards
          # the secret on the user-initiated connect flow; background token refresh runs
          # without it, so the shipped .exe needs this compile-time fallback or the Google
          # connection drops every ~1h in release builds.
          GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_KEY }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "Neko Finance v__VERSION__"
          releaseDraft: true
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}

      # SLSA build provenance for everything we ship (verifiable with
      # `gh attestation verify <file> --repo <owner>/<repo>`).
      - name: Attest build provenance (bundles)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage

      - name: Attest build provenance (portable exe)
        if: matrix.platform == 'windows-latest'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: src-tauri/target/release/neko-finance.exe

      # The bundles above are installers (NSIS/MSI). Also publish the portable
      # single-file exe: the WebView2 loader and the VC runtime are statically
      # linked on the msvc target (webview2-com-sys + tauri-build defaults),
      # so the binary runs standalone on Windows 10/11.
      - name: Upload portable single-file exe (workflow artifact)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neko-finance-windows-x64-portable
          path: src-tauri/target/release/neko-finance.exe

      - name: Attach portable exe to the release
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          Copy-Item "src-tauri/target/release/neko-finance.exe" "neko-finance-$env:TAG-windows-x64-portable.exe"
          gh release upload "$env:TAG" "neko-finance-$env:TAG-windows-x64-portable.exe" --clobber
