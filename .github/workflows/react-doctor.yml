name: React Doctor

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "doctor.config.json"
  # O scan de `main` varre o projeto inteiro e é o que mantém a dívida existente visível: o gate de
  # PR compara com a base e enxerga só o que o PR introduz, então o que já estava lá nunca
  # apareceria por ali.
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "doctor.config.json"

# Least privilege at the top level; the write scopes react-doctor needs to
# annotate pull requests are granted at the job level below.
permissions:
  contents: read

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # O pin é o COMMIT do release, nunca o objeto de tag. A versão fica junto do CLI que o gate
      # local usa: pinada atrás, o CI passa a julgar o mesmo código por outro conjunto de regras.
      - uses: millionco/react-doctor@01820bb4fd4d0a4aebcd8df2b2a143a098649cb2 # v2.2.8
        with:
          # Este é o gate: nenhuma ferramenta local reproduz o veredito do scan por completo, então
          # deixá-lo consultivo é o mesmo que não ter regra — a violação chega ao merge com um
          # comentário que ninguém é obrigado a atender. `scope: changed` mantém a cobrança no que
          # o PR introduz; a dívida que já existia é assunto do scan de `main`.
          blocking: warning
          scope: changed
