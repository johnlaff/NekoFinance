name: React Doctor

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "doctor.config.json"

# Least privilege at the top level; the write scopes react-doctor needs to
# annotate pull requests are granted at the job level below.
permissions:
  contents: read

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: millionco/react-doctor@30369b6000d2bcb08ec34e07f1486ef1fbe482de # react-doctor@0.7.6
        with:
          blocking: none
          scope: changed
