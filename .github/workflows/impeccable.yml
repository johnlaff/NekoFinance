name: Impeccable UI Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/App.tsx"
      - "src/App.css"
      - "src/**/*.tsx"
      - "src/**/*.css"

permissions:
  contents: read

concurrency:
  group: impeccable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Impeccable UI audit
        run: npm run ui:audit
