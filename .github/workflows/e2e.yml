name: E2E Visual Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "vite.config.ts"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        # --ignore-scripts: consistente com a política dos demais workflows (não roda lifecycle
        # scripts de deps). O Chromium é instalado explicitamente no passo seguinte.
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright visual smoke tests
        run: npm run e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
