name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # gitleaks comments findings on pull requests
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore private privacy denylist
        # Só em push ou PR same-repo: forks não recebem secrets de todo modo, mas o guard torna
        # explícito que a denylist privada nunca é materializada num workspace que rode código
        # de terceiros.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          PRIVATE_FORBIDDEN_PATTERNS_B64: ${{ secrets.PRIVATE_FORBIDDEN_PATTERNS_B64 }}
        run: |
          if [ -n "$PRIVATE_FORBIDDEN_PATTERNS_B64" ]; then
            umask 077
            printf '%s' "$PRIVATE_FORBIDDEN_PATTERNS_B64" | base64 -d > .private-forbidden-patterns
          fi
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Privacy scan
        env:
          PRIVACY_SCAN_REQUIRE_DENYLIST: ${{ secrets.PRIVATE_FORBIDDEN_PATTERNS_B64 != '' && '1' || '0' }}
        run: bash scripts/privacy-scan.sh
