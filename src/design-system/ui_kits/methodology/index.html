<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Neko Finance — Ajuda</title>
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
      }
      #app {
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <script src="../../_ds_bundle.js"></script>
    <script src="../shared/icons.jsx"></script>
    <script src="../dashboard/AppShell.jsx"></script>
    <script type="text/babel" src="MethodologyScreen.jsx"></script>
    <script type="text/babel">
      function App() {
        const [nav, setNav] = React.useState("methodology");
        return (
          <window.AppShell
            active={nav}
            onNav={setNav}
            title="Ajuda"
            crumb="Como o Neko calcula"
          >
            <window.MethodologyScreen />
          </window.AppShell>
        );
      }
      ReactDOM.createRoot(document.getElementById("app")).render(<App />);
    </script>
  </body>
</html>
