<!-- @dsCard group="Colors" viewport="700x150" name="Money & Ownership" subtitle="Positive/negative cashflow + personal/partner/shared owner accents" -->
<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        padding: 20px;
        display: flex;
        gap: 28px;
      }
      .group {
        flex: 1;
      }
      .label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-faint);
        margin: 0 0 12px;
      }
      .items {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex: none;
      }
      .pill {
        padding: 2px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
      }
      .amt {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 14px;
        font-weight: 500;
      }
      .name {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="group">
      <div class="label">Cashflow</div>
      <div class="items">
        <div class="item">
          <span class="amt" style="color: var(--money-pos)">+ $4,820.00</span
          ><span class="name" style="color: var(--text-muted)">money-pos</span>
        </div>
        <div class="item">
          <span class="amt" style="color: var(--money-neg)">− $1,344.18</span
          ><span class="name" style="color: var(--text-muted)">money-neg</span>
        </div>
        <div class="item">
          <span class="amt" style="color: var(--money-neutral)">$0.00</span
          ><span class="name" style="color: var(--text-muted)">money-neutral</span>
        </div>
      </div>
    </div>
    <div class="group">
      <div class="label">Ownership</div>
      <div class="items">
        <div class="item">
          <span class="dot" style="background: var(--owner-personal)"></span
          ><span
            class="pill"
            style="background: var(--primary-quiet); color: var(--owner-personal)"
            >Personal</span
          ><span class="name" style="color: var(--text-faint)">owner-personal</span>
        </div>
        <div class="item">
          <span class="dot" style="background: var(--owner-partner)"></span
          ><span
            class="pill"
            style="background: rgba(201, 139, 212, 0.14); color: var(--owner-partner)"
            >Partner</span
          ><span class="name" style="color: var(--text-faint)">owner-partner</span>
        </div>
        <div class="item">
          <span class="dot" style="background: var(--owner-shared)"></span
          ><span
            class="pill"
            style="background: rgba(95, 168, 220, 0.14); color: var(--owner-shared)"
            >Shared</span
          ><span class="name" style="color: var(--text-faint)">owner-shared</span>
        </div>
      </div>
    </div>
  </body>
</html>
