<!-- @dsCard group="Colors" viewport="700x172" name="Neutrals — Ink ramp" subtitle="Graphite-ink scale: backgrounds, surfaces, borders, text" -->
<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        padding: 20px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .sw {
        flex: 1;
      }
      .chip {
        height: 64px;
        border-radius: var(--radius-sm);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .name {
        font-size: 10.5px;
        font-weight: 600;
        margin-top: 7px;
      }
      .hex {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-muted);
        margin-top: 1px;
      }
      .role {
        font-size: 9.5px;
        color: var(--text-faint);
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="sw">
        <div class="chip" style="background: var(--ink-900)"></div>
        <div class="name">ink-900</div>
        <div class="hex">#0E1413</div>
        <div class="role">bg</div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--ink-800)"></div>
        <div class="name">ink-800</div>
        <div class="hex">#161D1C</div>
        <div class="role">surface</div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--ink-700)"></div>
        <div class="name">ink-700</div>
        <div class="hex">#1F2827</div>
        <div class="role">elevated</div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--ink-600)"></div>
        <div class="name">ink-600</div>
        <div class="hex">#2A3433</div>
        <div class="role">border</div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--ink-500)"></div>
        <div class="name">ink-500</div>
        <div class="hex">#3A4644</div>
        <div class="role">border+</div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--ink-300)"></div>
        <div class="name">ink-300</div>
        <div class="hex">#6B7572</div>
        <div class="role">faint</div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--ink-200)"></div>
        <div class="name">ink-200</div>
        <div class="hex">#9AA5A2</div>
        <div class="role">muted</div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--ink-050)"></div>
        <div class="name">ink-050</div>
        <div class="hex">#E8EDEB</div>
        <div class="role">text</div>
      </div>
    </div>
  </body>
</html>
