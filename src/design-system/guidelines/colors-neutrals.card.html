<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        padding: 20px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .sw {
        flex: 1;
      }
      .chip {
        height: 64px;
        border-radius: var(--radius-sm);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .name {
        font-size: 10.5px;
        font-weight: 600;
        margin-top: 7px;
      }
      .hex {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-muted);
        margin-top: 1px;
      }
      .role {
        font-size: 9.5px;
        color: var(--text-faint);
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="sw">
        <div class="chip" style="background: var(--bg)"></div>
        <div class="name">bg</div>
        <div class="hex">#09090B</div>
        <div class="role">bg</div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--surface)"></div>
        <div class="name">surface</div>
        <div class="hex">#18181B</div>
        <div class="role">surface</div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--surface-elevated)"></div>
        <div class="name">surface-elevated</div>
        <div class="hex">#27272A</div>
        <div class="role">elevated</div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--border)"></div>
        <div class="name">border</div>
        <div class="hex">#27272A</div>
        <div class="role">border</div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--border-strong)"></div>
        <div class="name">border-strong</div>
        <div class="hex">#3F3F46</div>
        <div class="role">border+</div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--text-faint)"></div>
        <div class="name">text-faint</div>
        <div class="hex">#8F8F99</div>
        <div class="role">faint</div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--text-muted)"></div>
        <div class="name">text-muted</div>
        <div class="hex">#A1A1AA</div>
        <div class="role">muted</div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--text)"></div>
        <div class="name">text</div>
        <div class="hex">#FAFAFA</div>
        <div class="role">text</div>
      </div>
    </div>
  </body>
</html>
