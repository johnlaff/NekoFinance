<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="4px base unit — space-1 (2px) through space-12 (64px)" -->
<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        padding: 22px;
      }
      .row {
        display: flex;
        align-items: flex-end;
        gap: 14px;
      }
      .item {
        text-align: center;
      }
      .bar {
        background: var(--primary);
        border-radius: 2px;
        width: 100%;
      }
      .box {
        display: flex;
        align-items: flex-end;
        height: 64px;
      }
      .name {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-muted);
        margin-top: 8px;
      }
      .px {
        font-size: 10px;
        color: var(--text-faint);
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="item">
        <div class="box"><div class="bar" style="height: 4px"></div></div>
        <div class="name">2</div>
        <div class="px">2px</div>
      </div>
      <div class="item">
        <div class="box"><div class="bar" style="height: 8px"></div></div>
        <div class="name">4</div>
        <div class="px">8px</div>
      </div>
      <div class="item">
        <div class="box"><div class="bar" style="height: 12px"></div></div>
        <div class="name">5</div>
        <div class="px">12px</div>
      </div>
      <div class="item">
        <div class="box"><div class="bar" style="height: 16px"></div></div>
        <div class="name">6</div>
        <div class="px">16px</div>
      </div>
      <div class="item">
        <div class="box"><div class="bar" style="height: 20px"></div></div>
        <div class="name">7</div>
        <div class="px">20px</div>
      </div>
      <div class="item">
        <div class="box"><div class="bar" style="height: 24px"></div></div>
        <div class="name">8</div>
        <div class="px">24px</div>
      </div>
      <div class="item">
        <div class="box"><div class="bar" style="height: 32px"></div></div>
        <div class="name">9</div>
        <div class="px">32px</div>
      </div>
      <div class="item">
        <div class="box"><div class="bar" style="height: 40px"></div></div>
        <div class="name">10</div>
        <div class="px">40px</div>
      </div>
      <div class="item">
        <div class="box"><div class="bar" style="height: 48px"></div></div>
        <div class="name">11</div>
        <div class="px">48px</div>
      </div>
      <div class="item">
        <div class="box"><div class="bar" style="height: 64px"></div></div>
        <div class="name">12</div>
        <div class="px">64px</div>
      </div>
    </div>
  </body>
</html>
