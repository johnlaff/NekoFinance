<!-- @dsCard group="Type" viewport="700x250" name="Display & Headings" subtitle="Geist — display 40 / h1 28 / h2 22 / h3 18 / title 16" -->
<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        padding: 22px;
      }
      .line {
        display: grid;
        grid-template-columns: 132px 1fr;
        align-items: center;
        gap: 16px;
        padding: 7px 0;
        border-bottom: 1px solid var(--border);
      }
      .line:last-child {
        border-bottom: none;
      }
      .spec {
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--text-faint);
        white-space: nowrap;
      }
      .specimen {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <div class="line">
      <span class="spec">display · 40/700</span
      ><span class="specimen t-display">Net worth $182,400</span>
    </div>
    <div class="line">
      <span class="spec">h1 · 28/700</span
      ><span class="specimen t-h1">Financial health</span>
    </div>
    <div class="line">
      <span class="spec">h2 · 22/600</span
      ><span class="specimen t-h2">Cashflow this month</span>
    </div>
    <div class="line">
      <span class="spec">h3 · 18/600</span
      ><span class="specimen t-h3">Category breakdown</span>
    </div>
    <div class="line">
      <span class="spec">title · 16/600</span
      ><span class="specimen t-title">Accounts &amp; cards</span>
    </div>
  </body>
</html>
