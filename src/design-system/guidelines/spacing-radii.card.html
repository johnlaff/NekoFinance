<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="xs 4 · sm 6 · md 10 · lg 14 · xl 20 · pill" -->
<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        padding: 22px;
        display: flex;
        gap: 18px;
        align-items: flex-end;
      }
      .item {
        text-align: center;
      }
      .box {
        width: 88px;
        height: 64px;
        background: var(--surface-elevated);
        border: 1px solid var(--border-strong);
        border-bottom: 2px solid var(--primary);
      }
      .name {
        font-family: var(--font-mono);
        font-size: 11px;
        margin-top: 9px;
      }
      .px {
        font-size: 10.5px;
        color: var(--text-faint);
      }
    </style>
  </head>
  <body>
    <div class="item">
      <div class="box" style="border-radius: var(--radius-xs)"></div>
      <div class="name">xs</div>
      <div class="px">4px · chips</div>
    </div>
    <div class="item">
      <div class="box" style="border-radius: var(--radius-sm)"></div>
      <div class="name">sm</div>
      <div class="px">6px · inputs</div>
    </div>
    <div class="item">
      <div class="box" style="border-radius: var(--radius-md)"></div>
      <div class="name">md</div>
      <div class="px">10px · cards</div>
    </div>
    <div class="item">
      <div class="box" style="border-radius: var(--radius-lg)"></div>
      <div class="name">lg</div>
      <div class="px">14px · panels</div>
    </div>
    <div class="item">
      <div class="box" style="border-radius: var(--radius-xl)"></div>
      <div class="name">xl</div>
      <div class="px">20px</div>
    </div>
    <div class="item">
      <div class="box" style="border-radius: var(--radius-pill); width: 64px"></div>
      <div class="name">pill</div>
      <div class="px">chips</div>
    </div>
  </body>
</html>
