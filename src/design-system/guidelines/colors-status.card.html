<!-- @dsCard group="Colors" viewport="700x150" name="Semantic — Status" subtitle="Success, warning, danger, info — each with a tint wash" -->
<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        padding: 20px;
      }
      .row {
        display: flex;
        gap: 12px;
      }
      .sw {
        flex: 1;
        border-radius: var(--radius-md);
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .chip {
        height: 44px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }
      .tint {
        height: 28px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        font-size: 11px;
      }
      .name {
        font-size: 12px;
        font-weight: 600;
      }
      .hex {
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="sw">
        <div class="chip" style="background: var(--surface)">
          <span class="dot" style="background: var(--success-500)"></span
          ><span class="name">Success</span>
        </div>
        <div
          class="tint"
          style="background: var(--success-tint); color: var(--success-400)"
        >
          <span class="hex">#34B981</span>
        </div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--surface)">
          <span class="dot" style="background: var(--warning-500)"></span
          ><span class="name">Warning</span>
        </div>
        <div
          class="tint"
          style="background: var(--warning-tint); color: var(--warning-400)"
        >
          <span class="hex">#E0A33E</span>
        </div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--surface)">
          <span class="dot" style="background: var(--danger-500)"></span
          ><span class="name">Danger</span>
        </div>
        <div
          class="tint"
          style="background: var(--danger-tint); color: var(--danger-400)"
        >
          <span class="hex">#E0625B</span>
        </div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--surface)">
          <span class="dot" style="background: var(--info-500)"></span
          ><span class="name">Info</span>
        </div>
        <div class="tint" style="background: var(--info-tint); color: var(--info-400)">
          <span class="hex">#4FA6CE</span>
        </div>
      </div>
    </div>
  </body>
</html>
