<!-- @dsCard group="Colors" viewport="700x196" name="Brand — Jade & Brass" subtitle="Primary jade (money/growth) + brass-amber feline warmth" -->
<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        padding: 20px;
      }
      .row {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }
      .row:last-child {
        margin-bottom: 0;
      }
      .sw {
        flex: 1;
        border-radius: var(--radius-sm);
        border: 1px solid rgba(255, 255, 255, 0.06);
        overflow: hidden;
      }
      .chip {
        height: 52px;
      }
      .meta {
        padding: 7px 9px;
      }
      .name {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .hex {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 2px;
      }
      .label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-faint);
        margin: 0 0 9px;
      }
    </style>
  </head>
  <body>
    <div class="label">Jade · primary</div>
    <div class="row">
      <div class="sw">
        <div class="chip" style="background: var(--jade-700)"></div>
        <div class="meta">
          <div class="name">jade-700</div>
          <div class="hex">#1C5C45</div>
        </div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--jade-600)"></div>
        <div class="meta">
          <div class="name">jade-600</div>
          <div class="hex">#237A57</div>
        </div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--jade-500)"></div>
        <div class="meta">
          <div class="name">jade-500</div>
          <div class="hex">#2E9B6F</div>
        </div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--jade-400)"></div>
        <div class="meta">
          <div class="name">jade-400 ·primary</div>
          <div class="hex">#3FBF8F</div>
        </div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--jade-300)"></div>
        <div class="meta">
          <div class="name">jade-300</div>
          <div class="hex">#6CD8AC</div>
        </div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--jade-200)"></div>
        <div class="meta">
          <div class="name">jade-200</div>
          <div class="hex">#A7E9CD</div>
        </div>
      </div>
    </div>
    <div class="label">Brass · secondary / warmth</div>
    <div class="row">
      <div class="sw">
        <div class="chip" style="background: var(--brass-700)"></div>
        <div class="meta">
          <div class="name">brass-700</div>
          <div class="hex">#8A5E1C</div>
        </div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--brass-600)"></div>
        <div class="meta">
          <div class="name">brass-600</div>
          <div class="hex">#B07E28</div>
        </div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--brass-500)"></div>
        <div class="meta">
          <div class="name">brass-500</div>
          <div class="hex">#D29B3A</div>
        </div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--brass-400)"></div>
        <div class="meta">
          <div class="name">brass-400 ·sec</div>
          <div class="hex">#E0A33E</div>
        </div>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--brass-300)"></div>
        <div class="meta">
          <div class="name">brass-300</div>
          <div class="hex">#ECC57E</div>
        </div>
      </div>
    </div>
  </body>
</html>
