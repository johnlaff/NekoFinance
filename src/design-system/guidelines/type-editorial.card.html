<!-- @dsCard group="Type" viewport="700x180" name="Editorial — Newsreader" subtitle="Serif voice for methodology / insights long-form only" -->
<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        padding: 24px 26px;
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--primary);
        margin-bottom: 10px;
      }
      .head {
        font-family: var(--font-serif);
        font-size: 26px;
        font-weight: 500;
        line-height: 1.2;
        letter-spacing: -0.01em;
        margin: 0 0 8px;
      }
      .body {
        font-family: var(--font-serif);
        font-size: 16px;
        line-height: 1.6;
        color: var(--text-muted);
        max-width: 560px;
      }
      .body em {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="eyebrow">Methodology</div>
    <h2 class="head">How shared expenses are split</h2>
    <p class="body">
      A shared expense is divided by <em>responsibility</em>, not by who paid. The payer
      is recorded for reconciliation, while the beneficiary determines whose budget it
      lands in. Newsreader carries the calm, considered voice reserved for rules and
      insights.
    </p>
  </body>
</html>
