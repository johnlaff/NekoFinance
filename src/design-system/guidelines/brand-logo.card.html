<!-- @dsCard group="Brand" viewport="700x210" name="Logo — Neko mark & lockup" subtitle="Friendly cat mark. On dark, on light, reversed on jade." -->
<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        padding: 24px;
        display: flex;
        gap: 20px;
        align-items: stretch;
      }
      .tile {
        flex: 1;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 20px;
      }
      .mark {
        width: 52px;
        height: 52px;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .lockup .mark {
        width: 38px;
        height: 38px;
      }
      .word {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .cap {
        font-size: 10.5px;
        color: var(--text-faint);
        font-family: var(--font-mono);
      }
    </style>
  </head>
  <body>
    <div class="tile" style="background: var(--surface)">

        <div class="mark">

            />

  </body>
</html>
