<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Quiet, cool shadows — card → raised → overlay → modal" -->
<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        padding: 26px 22px;
        display: flex;
        gap: 26px;
        align-items: center;
      }
      .item {
        text-align: center;
      }
      .box {
        width: 116px;
        height: 72px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
      }
      .name {
        font-family: var(--font-mono);
        font-size: 11px;
        margin-top: 12px;
      }
      .use {
        font-size: 10.5px;
        color: var(--text-faint);
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <div class="item">
      <div class="box" style="box-shadow: var(--shadow-1)"></div>
      <div class="name">shadow-1</div>
      <div class="use">cards</div>
    </div>
    <div class="item">
      <div class="box" style="box-shadow: var(--shadow-2)"></div>
      <div class="name">shadow-2</div>
      <div class="use">raised</div>
    </div>
    <div class="item">
      <div class="box" style="box-shadow: var(--shadow-3)"></div>
      <div class="name">shadow-3</div>
      <div class="use">popover / overlay</div>
    </div>
    <div class="item">
      <div class="box" style="box-shadow: var(--shadow-4)"></div>
      <div class="name">shadow-4</div>
      <div class="use">modal / dialog</div>
    </div>
  </body>
</html>
