<!-- @dsCard group="Components" viewport="760x1000" name="Copilot — Mia chat, citações, estados" subtitle="ChatBubble · Citation · EmptyState · MiaAvatar" -->
<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        padding: 22px;
      }
      .grid {
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      .group {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .lbl {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-faint);
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .rowx {
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
      }
      .states-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .state-box {
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .avatar-row {
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .avatar-label {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 4px;
      }
      .avatar-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <script src="../../_ds_bundle.js"></script>
    <script type="text/babel">
      const { ChatBubble, Citation, EmptyState, MiaAvatar, Button } =
        window.NekoFinanceDesignSystem_9bd1cd;

      function Demo() {
        return (
          <div className="grid">
            {/* ── MiaAvatar ── */}
            <div className="group">
              <div className="lbl">MiaAvatar — tamanhos</div>
              <div className="rowx">
                <div className="avatar-item">
                  <MiaAvatar width={24} height={24} />
                  <span className="avatar-label">24</span>
                </div>
                <div className="avatar-item">
                  <MiaAvatar width={32} height={32} />
                  <span className="avatar-label">32</span>
                </div>
                <div className="avatar-item">
                  <MiaAvatar />
                  <span className="avatar-label">40 (padrão)</span>
                </div>
                <div className="avatar-item">
                  <MiaAvatar width={56} height={56} />
                  <span className="avatar-label">56</span>
                </div>
                <div className="avatar-item">
                  <MiaAvatar width={72} height={72} />
                  <span className="avatar-label">72</span>
                </div>
              </div>
            </div>

            {/* ── ChatBubble ── */}
            <div className="group">
              <div className="lbl">ChatBubble — conversa com a Mia</div>
              <div className="stack">
                <ChatBubble from="user" userInitials="JL">
                  Quanto gastei com alimentação no mês passado?
                </ChatBubble>

                <ChatBubble from="mia">
                  <p>
                    Em maio você gastou{" "}
                    <span className="nk-chat__money">R$ 486,20</span> com alimentação{" "}
                    <Citation index={1} source="Aba 'Maio 2025' · 11 linhas" /> — cerca
                    de <b>14%</b> do total de saídas variáveis.
                  </p>
                  <Citation
                    variant="tool"
                    fn="soma(Alimentação, Maio 2025)"
                    lines={[
                      { label: "Delivery · 03 mai", value: "94,50" },
                      { label: "Mercado Central · 10 mai", value: "187,30" },
                      { label: "Restaurante Maia · 17 mai", value: "78,40" },
                      { label: "+ 8 mais", value: "126,00" },
                    ]}
                    total={{ label: "Total", value: "R$ 486,20" }}
                    source="Aba 'Maio 2025' · 11 linhas"
                  />
                </ChatBubble>

                <ChatBubble from="user" userInitials="JL">
                  E esse mês, como estou em relação ao teto diário?
                </ChatBubble>

                <ChatBubble from="mia">
                  <p>
                    Até hoje (dia 21) você usou{" "}
                    <span className="nk-chat__money">R$ 1.842,00</span> das{" "}
                    <span className="nk-chat__money">R$ 2.310,00</span> disponíveis{" "}
                    <Citation index={2} source="Teto diário · junho" /> — restam{" "}
                    <b>9 dias</b> e um saldo de{" "}
                    <span className="nk-chat__money">R$ 468,00</span>. Seu ritmo diário
                    médio está em <span className="nk-chat__money">R$ 87,71</span>,
                    levemente abaixo do teto de{" "}
                    <span className="nk-chat__money">R$ 110,00/dia</span>.
                  </p>
                </ChatBubble>

                <ChatBubble from="mia" thinking />
              </div>
            </div>

            {/* ── Citation standalone ── */}
            <div className="group">
              <div className="lbl">Citation — chip inline e bloco de cálculo</div>
              <div className="stack">
                <Citation
                  variant="tool"
                  fn="soma(Cartão, Junho 2025)"
                  lines={[
                    { label: "Cartão · fatura 05/jun", value: "1.230,40" },
                    { label: "Inter · fatura 12/jun", value: "845,90" },
                    { label: "C6 · fatura 18/jun", value: "312,00" },
                  ]}
                  total={{ label: "Total cartões", value: "R$ 2.388,30" }}
                  source="Aba 'Junho 2025' · 3 cartões"
                />
              </div>
            </div>

            {/* ── EmptyState — quatro variantes ── */}
            <div className="group">
              <div className="lbl">
                EmptyState — variantes (empty · skeleton · loading · error)
              </div>
              <div className="states-grid">
                <div className="state-box">
                  <EmptyState
                    variant="empty"
                    title="Nenhuma transação ainda"
                    description="Conecte uma planilha Google e a Mia vai importar e categorizar suas movimentações."
                    action={<Button variant="primary">Conectar Planilha</Button>}
                  />
                </div>
                <div className="state-box">
                  <EmptyState variant="skeleton" skeletonRows={5} />
                </div>
                <div className="state-box">
                  <EmptyState variant="loading" title="Lendo sua planilha…" />
                </div>
                <div className="state-box">
                  <EmptyState
                    variant="error"
                    title="Não foi possível acessar a aba"
                    description="Verifique se a planilha está compartilhada com a conta conectada."
                    action={<Button variant="secondary">Tentar novamente</Button>}
                  />
                </div>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    </script>
  </body>
</html>
