<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        padding: 20px;
      }
      .wrap {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 22px;
        align-items: start;
      }
      .chat {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .lbl {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-faint);
        margin-bottom: 10px;
      }
      .states {
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <script src="../../_ds_bundle.js"></script>
    <script type="text/babel">
      const { ChatBubble, Citation, EmptyState, Button } =
        window.NekoFinanceDesignSystem_9bd1cd;
      function Demo() {
        return (
          <div className="wrap">
            <div>
              <div className="lbl">Mia chat · cited & deterministic</div>
              <div className="chat">
                <ChatBubble from="user" userInitials="AT">
                  How much did we spend on dining last month?
                </ChatBubble>
                <ChatBubble from="mia">
                  <p>
                    You spent <span className="nk-chat__money">$486.20</span> on dining
                    in May <Citation index={1} source="11 rows" /> — about <b>11%</b> of
                    variable spending.
                  </p>
                  <Citation
                    variant="tool"
                    fn="sum(Dining, May 2025)"
                    lines={[
                      { label: "Bottega · 12 May", value: "78.00" },
                      { label: "Tonkotsu · 19 May", value: "44.20" },
                      { label: "+ 9 more", value: "364.00" },
                    ]}
                    total={{ label: "Total", value: "$486.20" }}
                    source="Sheet ‘Expenses 2025’ · 11 rows"
                  />
                </ChatBubble>
                <ChatBubble from="mia" thinking />
              </div>
            </div>
            <div>
              <div className="lbl">States</div>
              <div className="states">
                <EmptyState
                  variant="empty"
                  title="No transactions yet"
                  description="Connect a Google Sheet and Mia will import and categorize your activity."
                  action={<Button variant="primary">Connect Google Sheets</Button>}
                />
              </div>
            </div>
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    </script>
  </body>
</html>
