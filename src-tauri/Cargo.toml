[package]
name = "neko-finance"
version = "0.2.1"
description = "Local-first, forecast-first personal finance desktop app (Google Sheets + deterministic projection engine + AI copilot)"
authors = ["John"]
edition = "2024"
# O crate tem dois binários (o app e o `mia-bench`), e o empacotador precisa saber
# qual deles é o produto — sem isto ele para em "failed to find main binary".
default-run = "neko-finance"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "neko_finance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Bancada de evals da conversa: roda o catálogo contra o loop real, com trava de gasto.
# Compila sempre e nunca roda em CI — custo real e chave dedicada são pré-condições de execução.
[[bin]]
name = "mia-bench"
path = "src/bin/mia_bench.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-process = "=2.3.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
oauth2 = { version = "5", features = ["reqwest"] }
reqwest = { version = "0.13", features = ["json", "form"] }
open = "5"
rand = "0.10"
chrono = "0.4"
calamine = "=0.36.1"
# `zip` is already in the tree transitively via `calamine` (resolves to 7.2.0); pinned as a
# direct dep at that SAME resolved version so the `.xlsx` cell-comment reader (import_local_xlsx)
# can open `xl/comments*.xml` without pulling a second `zip` major version into the graph.
zip = "=8.6.0"
# Direct dep pinned at the fixed line (>=0.41) for parsing `xl/comments*.xml` — the transitive
# `quick-xml 0.39.4` pulled in by `calamine`/`plist` is under RUSTSEC-2026-0194/0195 (ignored for
# that path in `.cargo/audit.toml`, which parses only Tauri's own build-time plist, not
# third-party XML at runtime). Our path parses untrusted `.xlsx` XML at runtime, so it stays on
# the patched line even though this duplicates a second `quick-xml` version in the dep tree.
quick-xml = "=0.41.0"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
aes-gcm = "0.11"
getrandom = "0.4"
sha2 = "0.11"
hex = "0.4"
# Standalone notifier for the `--remind` CLI path (plan 039): the OS scheduler
# launches the binary with `--remind` when the app is closed, with no Tauri
# AppHandle available. Cross-platform (Linux dbus / macOS / Windows WinRT toast).
notify-rust = "=4.18.0"
