[package]
name = "neko-finance"
version = "0.3.1"
description = "Local-first, forecast-first personal finance desktop app (Google Sheets + deterministic projection engine + AI copilot)"
authors = ["John"]
edition = "2024"
# O crate tem dois binários (o app e o `mia-bench`), e o empacotador precisa saber
# qual deles é o produto — sem isto ele para em "failed to find main binary".
default-run = "neko-finance"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "neko_finance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Bancada de evals da conversa: roda o catálogo contra o loop real, com trava de gasto.
# Compila sempre e nunca roda em CI — custo real e chave dedicada são pré-condições de execução.
[[bin]]
name = "mia-bench"
path = "src/bin/mia_bench.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-dialog = "=2.7.2"
# Só a rota de import local de .xlsx a usa: no Android o picker do `dialog` devolve um
# content:// (sem caminho de filesystem real), então o front lê os bytes por aqui antes de
# invocar o comando Rust — o mesmo caminho funciona sem mudança em desktop.
tauri-plugin-fs = "=2.5.1"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-process = "=2.3.1"
# Só registrado no Android (lib.rs, cfg(target_os = "android")) — o retorno do OAuth por esquema
# próprio do app (spec 044); desktop permanece no loopback HTTP, sem tocar a configuração de
# protocolo do instalador.
tauri-plugin-deep-link = "=2.4.9"
# Detecção de plataforma no front (`platform()`), para as superfícies sem equivalente Android
# (updater, lembrete no nível do SO) mostrarem estado honesto de indisponibilidade em vez de
# silenciar como se tivessem rodado.
tauri-plugin-os = "=2.3.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
oauth2 = { version = "5", features = ["reqwest"] }
reqwest = { version = "0.13", features = ["json", "form", "query"] }
# Raízes de CA da Mozilla embutidas no binário — só o núcleo de rede Android as usa
# (`http::android_client_builder`), no lugar do verificador de plataforma padrão do `reqwest`
# (`rustls-platform-verifier`), que no Android exige uma ponte JNI+Gradle que o app não tem. O
# crate em si não depende de plataforma nenhuma, então fica em `[dependencies]` normal para o
# parsing (`embedded_root_certs`) ser testável em qualquer host. As trocas dessa rota (raízes
# presas na versão do build, sem CRL/OCSP, sem CA corporativa/de usuário no Android) e quando
# revalidá-las estão documentadas no doc comment de `android_client_builder` (verificado 2026-08).
webpki-root-certs = "1"
open = "5"
rand = "0.10"
chrono = "0.4"
calamine = "=0.36.1"
# `zip` is already in the tree transitively via `calamine` (resolves to 7.2.0); pinned as a
# direct dep at that SAME resolved version so the `.xlsx` cell-comment reader (import_local_xlsx)
# can open `xl/comments*.xml` without pulling a second `zip` major version into the graph.
zip = "=8.6.0"
# Direct dep pinned at the fixed line (>=0.41) for parsing `xl/comments*.xml` — the transitive
# `quick-xml 0.39.4` pulled in by `calamine`/`plist` is under RUSTSEC-2026-0194/0195 (ignored for
# that path in `.cargo/audit.toml`, which parses only Tauri's own build-time plist, not
# third-party XML at runtime). Our path parses untrusted `.xlsx` XML at runtime, so it stays on
# the patched line even though this duplicates a second `quick-xml` version in the dep tree.
quick-xml = "=0.41.0"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
aes-gcm = "0.11"
getrandom = "0.4"
sha2 = "0.11"
hex = "0.4"
# Standalone notifier for the `--remind` CLI path (plan 039): the OS scheduler
# launches the binary with `--remind` when the app is closed, with no Tauri
# AppHandle available. Cross-platform (Linux dbus / macOS / Windows WinRT toast).
notify-rust = "=4.18.0"
# Só a feature "sync" (default) — a chamada de espaço em disco da pré-checagem de update é
# síncrona, sem precisar do runtime tokio da feature "tokio".
fs4 = "=1.1.0"

# O cofre de segredos (ADR-0014, secret_vault.rs) não tem braço Android — `keyring` cobre
# apple-native/windows-native/sync-secret-service e nada mais. Este crate registra um
# CredentialBuilder para o mesmo `keyring::Entry` já usado pelo desktop, gerando a chave AES não
# exportável no AndroidKeyStore (via JNI) e cifrando o valor numa SharedPreferences privada — a
# leitura do contexto JNI vem de `ndk-context`, populado pelo shim Kotlin de `MainActivity`
# (gen/android) via a ponte JNI em `secret_vault.rs`. Rótulo "Experimental" no próprio crate:
# risco documentado, não uma implementação de crypto própria — a cifra é a API nativa do
# Keystore. `ndk-context` pinada na mesma versão que `android-keyring` e `tao` já resolvem
# (checar `cargo tree -i ndk-context` a cada bump) — é o mesmo estado global dos três, e
# `secret_vault::install_platform_backend` precisa sondá-lo diretamente antes de chamar o
# builder do keyring (ver o comentário do módulo).
[target.'cfg(target_os = "android")'.dependencies]
android-keyring = "=0.2.0"
ndk-context = "=0.1.1"
# Dep direta só para a ponte JNI de `secret_vault.rs` (`Java_..._initNdkContext`) que POPULA o
# `ndk-context` acima — pinada na mesma versão que `android-keyring`/`tao` já resolvem
# (checar `cargo tree -i jni` a cada bump) para não duplicar a crate no grafo.
jni = "=0.22.4"

[dev-dependencies]
# Borda HTTP mockada para o transporte do snapshot no Drive (spec 043) — sobe um servidor local
# efêmero, nenhum teste toca a rede real.
mockito = "1"
