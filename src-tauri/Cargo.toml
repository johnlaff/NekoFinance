[package]
name = "neko-finance"
version = "0.1.0"
description = "Local-first, forecast-first personal finance desktop app (Google Sheets + deterministic projection engine + AI copilot)"
authors = ["John"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "neko_finance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
tauri = { version = "=2.11.2", features = [] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-sql = { version = "=2.4.0", features = ["sqlite"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
oauth2 = { version = "5", features = ["reqwest"] }
reqwest = { version = "0.12", features = ["json"] }
open = "5"
rand = "0.8"
chrono = "0.4"
calamine = "=0.35.0"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
